<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CoreBot Control Panel</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
  <link rel="stylesheet" href="styles.css" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ink: { 950: '#0b1220', 900: '#0f172a', 800: '#111a2e', 700: '#1e293b', 600: '#334155' },
            accent: { 500: '#3b82f6', 600: '#2563eb' },
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
</head>
<body class="bg-ink-950 text-slate-200 min-h-screen font-sans" style="background:#0b1220;color:#e2e8f0;font-family:Inter,system-ui,sans-serif;">

<noscript>
  <div style="max-width:420px;margin:80px auto;padding:24px;border:1px solid #334155;border-radius:12px;background:#0f172a;">
    <h2 style="color:#fff;margin:0 0 8px">JavaScript отключён</h2>
    <p style="color:#94a3b8;margin:0">Для работы панели включите JS в браузере и обновите страницу.</p>
  </div>
</noscript>

<!-- Видим, пока bootstrap JS не отработал. Скрывается в DOMContentLoaded. -->
<div id="bootSplash" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b1220;z-index:9999;">
  <div style="text-align:center">
    <div style="width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#3b82f6,#2563eb);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;margin:0 auto 12px;">CB</div>
    <div style="color:#94a3b8;font-size:14px;">Загрузка панели…</div>
    <div id="bootError" style="color:#fda4af;font-size:12px;margin-top:12px;max-width:520px;display:none;"></div>
  </div>
</div>

<!-- =========================== Login screen =========================== -->
<section id="loginScreen" class="min-h-screen items-center justify-center p-6 flex" style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;">
  <div class="w-full max-w-sm bg-ink-900 rounded-2xl shadow-xl border border-ink-700 p-8" style="width:100%;max-width:380px;background:#0f172a;border:1px solid #1e293b;border-radius:16px;padding:32px;box-shadow:0 10px 25px rgba(0,0,0,.35);">
    <div class="flex items-center gap-3 mb-6" style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-accent-500 to-accent-600 flex items-center justify-center font-bold text-white" style="width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#3b82f6,#2563eb);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;">CB</div>
      <div>
        <h1 class="text-xl font-semibold text-white" style="margin:0;color:#fff;font-size:20px;font-weight:600;">CoreBot</h1>
        <p class="text-xs text-slate-400" style="margin:0;color:#94a3b8;font-size:12px;">Control Panel</p>
      </div>
    </div>
    <form id="loginForm" class="space-y-4">
      <div style="margin-bottom:14px;">
        <label class="block text-xs uppercase tracking-wide text-slate-400 mb-1" style="display:block;color:#94a3b8;font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;">Логин</label>
        <input id="username" type="text" autocomplete="username" required
          class="w-full px-3 py-2 rounded-lg bg-ink-800 border border-ink-600 text-slate-100 focus:border-accent-500 focus:outline-none focus:ring-1 focus:ring-accent-500"
          style="width:100%;box-sizing:border-box;padding:10px 12px;border-radius:8px;background:#111a2e;border:1px solid #334155;color:#e2e8f0;outline:none;" />
      </div>
      <div style="margin-bottom:18px;">
        <label class="block text-xs uppercase tracking-wide text-slate-400 mb-1" style="display:block;color:#94a3b8;font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;">Пароль</label>
        <input id="password" type="password" autocomplete="current-password" required
          class="w-full px-3 py-2 rounded-lg bg-ink-800 border border-ink-600 text-slate-100 focus:border-accent-500 focus:outline-none focus:ring-1 focus:ring-accent-500"
          style="width:100%;box-sizing:border-box;padding:10px 12px;border-radius:8px;background:#111a2e;border:1px solid #334155;color:#e2e8f0;outline:none;" />
      </div>
      <button id="loginBtn" type="submit"
        class="w-full py-2 rounded-lg bg-accent-600 hover:bg-accent-500 text-white font-medium transition"
        style="width:100%;padding:10px;border-radius:8px;background:#2563eb;border:none;color:#fff;font-weight:500;cursor:pointer;">
        Войти
      </button>
      <p id="loginMsg" class="text-sm text-rose-400 hidden" style="display:none;color:#fda4af;font-size:13px;margin-top:10px;"></p>
    </form>
  </div>
</section>

<!-- =========================== App shell =========================== -->
<div id="appShell" class="hidden min-h-screen flex">

  <!-- Sidebar -->
  <aside class="w-60 shrink-0 bg-ink-900 border-r border-ink-700 flex flex-col">
    <div class="px-4 py-4 border-b border-ink-700 flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-accent-500 to-accent-600 flex items-center justify-center font-bold text-white">CB</div>
      <div class="leading-tight">
        <div class="text-sm font-semibold text-white">CoreBot</div>
        <div class="text-[11px] text-slate-400">Control Panel</div>
      </div>
    </div>
    <nav id="sideNav" class="flex-1 p-2 space-y-1">
      <a href="#/dashboard" data-route="dashboard" class="nav-link">
        <span class="nav-ico">📊</span> Дашборд
      </a>
      <a href="#/accounts" data-route="accounts" class="nav-link">
        <span class="nav-ico">👤</span> Аккаунты
      </a>
      <a href="#/dialogs" data-route="dialogs" class="nav-link">
        <span class="nav-ico">💬</span> Диалоги
      </a>
      <a href="#/mailings" data-route="mailings" class="nav-link">
        <span class="nav-ico">📣</span> Рассылки
      </a>
      <a href="#/clients" data-route="clients" class="nav-link">
        <span class="nav-ico">🧑‍🤝‍🧑</span> Клиенты
      </a>
      <a href="#/groups" data-route="groups" class="nav-link">
        <span class="nav-ico">📁</span> Группы
      </a>
      <a href="#/proxies" data-route="proxies" class="nav-link">
        <span class="nav-ico">🌐</span> Прокси
      </a>
      <a href="#/archive" data-route="archive" class="nav-link">
        <span class="nav-ico">🗃</span> Архив
      </a>
      <a href="#/logs" data-route="logs" class="nav-link">
        <span class="nav-ico">📜</span> Логи
      </a>
      <a href="#/settings" data-route="settings" class="nav-link">
        <span class="nav-ico">⚙️</span> Настройки
      </a>
    </nav>
    <div class="border-t border-ink-700 px-3 py-3 text-xs">
      <div class="flex items-center justify-between">
        <span class="text-slate-400">Поток:</span>
        <span id="sseStatus" class="text-slate-500">offline</span>
      </div>
      <div class="flex items-center justify-between mt-2">
        <span class="text-slate-400" id="userBadge">—</span>
        <button id="logoutBtn" class="text-rose-400 hover:text-rose-300">Выйти</button>
      </div>
    </div>
  </aside>

  <!-- Main column -->
  <main class="flex-1 min-w-0 flex flex-col">
    <header class="px-6 py-4 border-b border-ink-700 bg-ink-900/60 flex items-center justify-between gap-4">
      <div>
        <h1 id="pageTitle" class="text-lg font-semibold text-white">Дашборд</h1>
        <p id="pageSubtitle" class="text-sm text-slate-400">Сводка по системе</p>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <button id="globalRefreshBtn" class="px-3 py-1.5 rounded-md bg-ink-700 hover:bg-ink-600 border border-ink-600 transition">
          ⟳ Обновить
        </button>
      </div>
    </header>

    <div id="pageRoot" class="flex-1 min-h-0 overflow-hidden">
      <!-- Сюда рендерятся секции -->
    </div>

    <div id="toast" class="hidden fixed bottom-4 right-4 z-50 max-w-md px-4 py-3 rounded-lg shadow-lg border border-ink-600 bg-ink-800 text-sm"></div>
  </main>
</div>

<script src="main.js" defer></script>
<script>
  // Watchdog: если main.js не отработал за 5 секунд — показать ошибку прямо в splash.
  window.addEventListener("error", function (e) {
    var box = document.getElementById("bootError");
    if (box) {
      box.style.display = "block";
      box.textContent = "Ошибка загрузки JS: " + (e && e.message ? e.message : "(unknown)");
    }
  });
  setTimeout(function () {
    var splash = document.getElementById("bootSplash");
    if (splash && splash.style.display !== "none") {
      var box = document.getElementById("bootError");
      if (box) {
        box.style.display = "block";
        box.textContent = "main.js не отработал за 5 c. Проверьте Network → main.js (статус 200?), затем DevTools → Console.";
      }
    }
  }, 5000);
</script>
</body>
</html>
