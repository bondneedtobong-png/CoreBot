[defaults]
# Fleet control-node defaults (task 07, ADR 0001: Ansible с control node WSL/Linux).
# Inventory file itself (inventory/hosts.yml) is created LOCALLY by the operator
# from inventory/hosts.yml.example and is never committed (see .gitignore).
inventory = inventory/hosts.yml
roles_path = roles
# Host key verification stays ON (ADR safety: no silent MITM on fleet SSH).
host_key_checking = True
# Vault password is ONLY local (operator file or secret manager, never Git).
# The path below lives OUTSIDE the repo (~/.ansible/...).
vault_identity_list = default@~/.ansible/vault-password-file
# Human-readable diffs; secrets are still masked by no_log on secret tasks.
stdout_callback = yaml
callback_whitelist =
display_args_to_stdout = False

[privilege_escalation]
become = False

[ssh_connection]
pipelining = True
retries = 2
